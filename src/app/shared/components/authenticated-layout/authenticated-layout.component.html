<mat-sidenav-container class="shell">
  <mat-sidenav #drawer mode="side" opened class="sidebar">
    <div class="brand"><mat-icon>inventory_2</mat-icon><span>Inventario</span></div>
    <mat-nav-list>
      @for (item of navigation; track item.route) {
        @if (canShow(item)) { <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link"><mat-icon matListItemIcon>{{ item.icon }}</mat-icon><span matListItemTitle>{{ item.label }}</span></a> }
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Alternar menú"><mat-icon>menu</mat-icon></button>
      <span class="toolbar-spacer"></span>
      @if (currentUser(); as user) {
        <span class="user-info"><span class="user-name">{{ user.username }}</span><span class="user-role">{{ user.role }}</span></span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión"><mat-icon>logout</mat-icon></button>
    </mat-toolbar>
    <main class="content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
